<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oh no, è finito!</title>
<meta name="description" content="Lista della spesa e dispensa condivise per la casa.">
<meta name="theme-color" content="#f3f1ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1b20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="È finito!">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div>
        <h1>Oh no, è <span>finito!</span></h1>
        <p class="tagline" id="tagline">la spesa di casa nostra</p>
      </div>
      <div class="actions">
        <i class="sync" id="sync" data-state="wait" role="status" aria-label="Collegamento in corso"></i>
        <button class="round-btn" id="refresh-btn" aria-label="Aggiorna" hidden></button>
        <button class="round-btn me" id="settings-btn" aria-label="La tua casa e il profilo" hidden></button>
      </div>
    </div>
    <div class="ptr" id="ptr" aria-hidden="true"><div class="ptr-in"><span id="ptr-icon"></span><span id="ptr-text">Tira per aggiornare</span></div></div>
  </header>

  <main>
    <div class="empty" id="view-boot"><strong>Sto aprendo la lista</strong>Un attimo…</div>
    <section class="view" id="view-setup" hidden></section>
    <section class="view" id="view-settings" hidden></section>

    <!-- Spesa -->
    <section class="view" id="view-shop" hidden>
      <div class="seg2" role="tablist" aria-label="Liste della spesa">
        <button role="tab" data-list="casa" aria-selected="true">Casa <span class="count zero" id="count-casa">0</span></button>
        <button role="tab" data-list="mio" aria-selected="false">Solo mio <span class="count zero" id="count-mio">0</span></button>
      </div>
      <p class="hint" id="shop-hint"></p>
      <form class="card addbar" id="add-form" autocomplete="off">
        <input class="main-in" type="text" id="add-name" placeholder="Cosa è finito?" maxlength="80" aria-label="Nome articolo" enterkeyhint="done">
        <button class="btn icon lilac" id="add-scan" type="button" aria-label="Scansiona codice a barre"></button>
        <button class="btn" id="add-btn" type="submit" disabled>Aggiungi</button>
        <div class="opts">
          <select class="pillsel" id="add-cat" aria-label="Categoria"></select>
          <button type="button" class="chipbtn" data-v="out" aria-pressed="true">Finito</button>
          <button type="button" class="chipbtn" data-v="low" aria-pressed="false">Sta finendo</button>
          <input type="text" class="text-in" id="add-note" placeholder="Nota (marca, quantità…)" maxlength="120" aria-label="Nota">
        </div>
      </form>
      <div class="filters" id="shop-filters" role="group" aria-label="Filtra per categoria"></div>
      <div id="shop-list"></div>
    </section>

    <!-- Dispensa -->
    <section class="view" id="view-pantry" hidden>
      <div id="pantry-expiring"></div>
      <div class="search">
        <input type="search" id="pantry-search" placeholder="Cerca in dispensa…" aria-label="Cerca in dispensa" autocomplete="off">
        <button class="btn icon lilac" id="pantry-scan" type="button" aria-label="Scansiona e aggiungi"></button>
        <button class="btn icon lilac" id="pantry-receipt" type="button" aria-label="Importa uno scontrino"></button>
        <button class="btn" id="pantry-add" type="button"></button>
      </div>
      <div class="filters" id="pantry-filters" role="group" aria-label="Filtra per zona"></div>
      <div id="pantry-list"></div>
    </section>
  </main>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <div class="tabbar-in" role="tablist" aria-label="Sezioni">
    <button role="tab" data-tab="spesa" aria-selected="true"><span id="tab-ico-spesa"></span>Spesa<span class="badge" id="badge-spesa" hidden></span></button>
    <button role="tab" data-tab="dispensa" aria-selected="false"><span id="tab-ico-dispensa"></span>Dispensa<span class="badge warn" id="badge-dispensa" hidden></span></button>
  </div>
</nav>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-undo">Annulla</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
