<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oh no, è finito!</title>
<meta name="description" content="Lista della spesa e dispensa condivise per la casa.">
<meta name="theme-color" content="#ffffff">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="È finito!">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <div class="ptr" id="ptr" aria-hidden="true"><div class="ptr-in"><span id="ptr-icon"></span><span id="ptr-text">Tira per aggiornare</span></div></div>

  <main>
    <div class="boot" id="view-boot"><strong>Oh no, è finito!</strong><span>Sto aprendo la lista…</span></div>
    <section class="view" id="view-setup" hidden></section>
    <section class="view" id="view-settings" hidden></section>

    <!-- Spesa -->
    <section class="view" id="view-shop" hidden>
      <div class="utabs" role="tablist" aria-label="Liste della spesa">
        <button role="tab" data-list="casa" aria-selected="true">Casa <span class="count" id="count-casa"></span></button>
        <button role="tab" data-list="mio" aria-selected="false">Solo mio <span class="count" id="count-mio"></span></button>
      </div>
      <div class="page-head" id="shop-head"></div>
      <form class="addbar" id="add-form" autocomplete="off">
        <div class="add-line">
          <input class="main-in" type="text" id="add-name" placeholder="Cosa è finito?" maxlength="80" aria-label="Nome articolo" enterkeyhint="done">
          <button class="in-btn" id="add-scan" type="button" aria-label="Scansiona codice a barre"></button>
        </div>
        <div class="opts">
          <label class="pill select-pill"><span class="sr">Categoria</span><select id="add-cat"></select></label>
          <button type="button" class="pill chipbtn" data-v="out" aria-pressed="true">Finito</button>
          <button type="button" class="pill chipbtn" data-v="low" aria-pressed="false">Sta finendo</button>
        </div>
        <div class="add-line2">
          <input type="text" class="text-in" id="add-note" placeholder="Nota (marca, quantità…)" maxlength="120" aria-label="Nota">
          <button class="btn" id="add-btn" type="submit" disabled>Aggiungi</button>
        </div>
      </form>
      <p class="hint" id="shop-hint"></p>
      <div id="shop-list"></div>
    </section>

    <!-- Dispensa -->
    <section class="view" id="view-pantry" hidden>
      <div class="utabs" role="tablist" aria-label="Come vedere la dispensa">
        <button role="tab" data-pview="zone" aria-selected="true">Zone</button>
        <button role="tab" data-pview="all" aria-selected="false">Elenco</button>
      </div>
      <div class="page-head" id="pantry-head"></div>
      <div class="pill-row" id="pantry-actions">
        <button class="pill" id="pantry-add" type="button"></button>
        <button class="pill" id="pantry-receipt" type="button"></button>
      </div>
      <div class="search" id="pantry-search-wrap" hidden>
        <input type="search" id="pantry-search" placeholder="Cerca in dispensa…" aria-label="Cerca in dispensa" autocomplete="off">
      </div>
      <div class="pill-row" id="pantry-filters" hidden></div>
      <div id="pantry-expiring"></div>
      <div id="pantry-list"></div>
    </section>
  </main>
</div>

<nav class="tabbar" id="tabbar" hidden>
  <div class="tabbar-in" role="tablist" aria-label="Sezioni">
    <button role="tab" data-tab="spesa" aria-selected="true"><span class="tab-ico" id="tab-ico-spesa"></span><span class="tab-lbl">Spesa</span><span class="badge" id="badge-spesa" hidden></span></button>
    <button role="tab" data-tab="dispensa" aria-selected="false"><span class="tab-ico" id="tab-ico-dispensa"></span><span class="tab-lbl">Dispensa</span><span class="badge warn" id="badge-dispensa" hidden></span></button>
    <button type="button" data-action="scan"><span class="tab-ico" id="tab-ico-scan"></span><span class="tab-lbl">Scansiona</span></button>
    <button role="tab" data-tab="casa" aria-selected="false"><span class="tab-ico tab-av" id="tab-ico-casa"></span><span class="tab-lbl">Casa</span></button>
  </div>
</nav>

<div id="sheet-root"></div>
<div class="toast" id="toast" role="status" hidden><span id="toast-text"></span><button type="button" id="toast-undo">Annulla</button></div>

<script type="module" src="app.js"></script>
</body>
</html>
