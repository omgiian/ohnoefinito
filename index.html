<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Oh no, è finito!</title>
<meta name="description" content="Lista condivisa di ciò che è finito in casa.">
<meta name="theme-color" content="#eef2ee" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="È finito!">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
<style>
:root {
  --bg: #eef2ee; --surface: #ffffff; --line: #d9e0da; --ink: #18221c; --muted: #5d6b62;
  --accent: #1e6a49; --accent-ink: #ffffff; --accent-soft: #dcece3;
  --out: #c8402f; --out-soft: #f8e1dc; --low: #a86f00; --low-soft: #f6ebd2; --focus: #2f7fd1;
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --radius: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #111613; --surface: #1a211d; --line: #2b352f; --ink: #e8eee9; --muted: #98a69d;
    --accent: #5cc493; --accent-ink: #0d1a13; --accent-soft: #1f3a2c;
    --out: #f07a68; --out-soft: #3d221e; --low: #e2b04a; --low-soft: #3a2f17; --focus: #7db4ee;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
input, select { font-size: 16px !important; } /* evita lo zoom automatico su iPhone */
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.wrap { max-width: 640px; margin: 0 auto; padding-bottom: 72px; }

header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--bg); padding-block: 14px 12px; display: grid; gap: 12px;
}
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
h1 { font-family: var(--font-display); font-weight: 800; font-size: 1.8rem; line-height: 1; letter-spacing: -0.02em; margin: 0; }
h1 em { font-style: normal; color: var(--out); }
.brand-right { display: flex; align-items: center; gap: 6px; }
.sync { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
.sync[data-state="live"] i { background: var(--accent); }
.sync[data-state="pending"] i { background: var(--low); }
.sync[data-state="error"] i { background: var(--out); }

.tabs { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; background: var(--line); padding: 4px; border-radius: 12px; }
.tab { border: 0; background: transparent; border-radius: 9px; padding: 9px 10px; font-weight: 600; display: flex; justify-content: center; align-items: center; gap: 8px; }
.tab[aria-selected="true"] { background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .08); }
.tab small { font-weight: 600; font-size: 12px; min-width: 22px; padding: 1px 7px; border-radius: 99px; background: var(--out-soft); color: var(--out); font-variant-numeric: tabular-nums; }
.tab small[data-zero] { background: transparent; color: var(--muted); }
.tab-hint { font-size: 12.5px; color: var(--muted); margin: -4px 2px 0; }

form.add { display: grid; grid-template-columns: 1fr auto; gap: 8px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 8px; }
form.add input#add-name { border: 0; background: transparent; padding: 8px 6px; min-width: 0; outline-offset: 0; }
form.add .opts { grid-column: 1 / -1; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
select, .seg button { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 12px; font-size: 13.5px; }
.seg { display: inline-flex; gap: 4px; }
.seg button[aria-pressed="true"][data-v="out"] { background: var(--out-soft); color: var(--out); border-color: transparent; font-weight: 600; }
.seg button[aria-pressed="true"][data-v="low"] { background: var(--low-soft); color: var(--low); border-color: transparent; font-weight: 600; }
.btn-add, .btn { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 10px; padding: 0 16px; min-height: 42px; }
.btn-add:disabled, .btn:disabled { opacity: .5; cursor: default; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--out); border: 1px solid var(--line); }
.note-in { flex: 1 1 140px; min-width: 0; border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 6px 12px; }

.filters { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.filters button { flex: none; border: 1px solid var(--line); background: transparent; border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--muted); }
.filters button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

main { display: grid; gap: 22px; margin-top: 8px; }
.notice { background: var(--low-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; font-size: 14px; }
.notice[data-kind="error"] { background: var(--out-soft); }
.section-title { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-family: var(--font-display); font-weight: 600; font-size: 1.15rem; margin: 0 2px 8px; }
.section-title span { font-family: var(--font-body); font-size: 13px; color: var(--muted); font-weight: 500; }
.group { display: grid; gap: 6px; }
.group + .group { margin-top: 14px; }
.group h3 { margin: 0 2px; font-size: 11.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; display: flex; align-items: center; gap: 7px; }
.dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.item { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 10px 10px 12px; }
.check { width: 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); background: transparent; display: grid; place-items: center; padding: 0; transition: background .15s, border-color .15s; }
.check svg { width: 16px; height: 16px; opacity: 0; transition: opacity .15s; }
@media (hover: hover) { .check:hover { border-color: var(--accent); } .check:hover svg { opacity: .4; } }
.item.done-anim .check { background: var(--accent); border-color: var(--accent); }
.item.done-anim .check svg { opacity: 1; color: var(--accent-ink); }
.body { min-width: 0; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.meta { font-size: 12.5px; color: var(--muted); overflow-wrap: anywhere; }
.meta .n { color: var(--ink); }
.right { display: flex; align-items: center; gap: 4px; }
.pill { border: 0; border-radius: 99px; padding: 5px 10px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill[data-s="out"] { background: var(--out-soft); color: var(--out); }
.pill[data-s="low"] { background: var(--low-soft); color: var(--low); }
.icon-btn { border: 0; background: transparent; color: var(--muted); width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; padding: 0; }
.icon-btn svg { width: 18px; height: 18px; }
.confirm-del { border: 0; background: var(--out); color: #fff; border-radius: 8px; padding: 6px 10px; font-size: 12.5px; font-weight: 600; }
.empty { border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 22px 18px; text-align: center; color: var(--muted); }
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.1rem; margin-bottom: 4px; }
.home { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 6px 6px 12px; font-size: 13.5px; max-width: 100%; }
.chip .label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip button { border: 0; border-radius: 99px; padding: 4px 10px; font-size: 12px; font-weight: 600; background: var(--out-soft); color: var(--out); }
.chip button.x { background: transparent; color: var(--muted); padding: 4px 7px; }
.home-hint { font-size: 12.5px; color: var(--muted); margin: 0 2px 8px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); border-radius: 12px; padding: 10px 12px 10px 16px; display: flex; gap: 12px; align-items: center; font-size: 14px; max-width: calc(100vw - 32px); z-index: 20; box-shadow: 0 6px 24px rgb(0 0 0 / .2); }
.toast button { border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 600; border-radius: 8px; padding: 4px 10px; }

/* schermata iniziale e impostazioni */
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 14px; }
.panel h2 { font-family: var(--font-display); font-size: 1.3rem; margin: 0; }
.panel p { margin: 0; color: var(--muted); }
.field { display: grid; gap: 6px; }
.field label { font-size: 13px; font-weight: 600; }
.field input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; width: 100%; min-width: 0; }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row > * { flex: 1 1 140px; }
.code { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 1.15rem; letter-spacing: .06em; background: var(--bg); border-radius: 10px; padding: 10px 12px; text-align: center; user-select: all; -webkit-user-select: all; overflow-wrap: anywhere; }
.or { text-align: center; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.steps { margin: 0; padding-left: 20px; color: var(--muted); font-size: 14px; display: grid; gap: 4px; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
@media (max-width: 400px) { h1 { font-size: 1.5rem; } .sync span { display: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>Oh no, è <em>finito!</em></h1>
      <div class="brand-right">
        <div class="sync" id="sync" data-state="wait"><i></i><span id="sync-text">Collegamento…</span></div>
        <button class="icon-btn" id="open-settings" aria-label="Impostazioni" hidden>
          <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="10" cy="10" r="2.6"/><path d="M10 2.5v2M10 15.5v2M2.5 10h2M15.5 10h2M4.7 4.7l1.4 1.4M13.9 13.9l1.4 1.4M4.7 15.3l1.4-1.4M13.9 6.1l1.4-1.4"/></svg>
        </button>
      </div>
    </div>
    <div id="app-top" hidden>
      <div style="display:grid;gap:12px">
        <div class="tabs" role="tablist" aria-label="Liste">
          <button class="tab" role="tab" data-list="casa" aria-selected="true">Casa <small id="count-casa" data-zero>0</small></button>
          <button class="tab" role="tab" data-list="mio" aria-selected="false">Solo mio <small id="count-mio" data-zero>0</small></button>
        </div>
        <p class="tab-hint" id="tab-hint"></p>
        <form class="add" id="add-form" autocomplete="off">
          <input type="text" id="add-name" placeholder="Cosa è finito? es. detersivo piatti" maxlength="80" aria-label="Nome articolo" enterkeyhint="done">
          <button class="btn-add" id="add-btn" type="submit" disabled>Aggiungi</button>
          <div class="opts">
            <select id="add-cat" aria-label="Categoria"></select>
            <div class="seg" role="group" aria-label="Quanto è urgente">
              <button type="button" data-v="out" aria-pressed="true">Finito</button>
              <button type="button" data-v="low" aria-pressed="false">Sta finendo</button>
            </div>
            <input type="text" class="note-in" id="add-note" placeholder="Nota (marca, quantità…)" maxlength="120" aria-label="Nota">
          </div>
        </form>
        <div class="filters" id="filters" role="group" aria-label="Filtra per categoria"></div>
      </div>
    </div>
  </header>

  <main id="main">
    <div class="empty"><strong>Sto aprendo la lista</strong>Un attimo…</div>
  </main>
</div>
<div class="toast" id="toast" hidden><span id="toast-text"></span><button type="button" id="toast-undo">Annulla</button></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  initializeFirestore, persistentLocalCache, persistentMultipleTabManager, memoryLocalCache,
  collection, doc, setDoc, updateDoc, deleteDoc, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlEXrtxHlq5NIEuqpiGZbquUzWvPMcOiE",
  authDomain: "ohnoefinito.firebaseapp.com",
  projectId: "ohnoefinito",
  storageBucket: "ohnoefinito.firebasestorage.app",
  messagingSenderId: "251015979077",
  appId: "1:251015979077:web:5c6c4b902cddf6b4a1032c",
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
let fs;
try {
  fs = initializeFirestore(fbApp, { localCache: persistentLocalCache({ tabManager: persistentMultipleTabManager() }) });
} catch (_) {
  fs = initializeFirestore(fbApp, { localCache: memoryLocalCache() });
}

const CATS = [
  { id: "cibo", label: "Cibo", color: "#d98a2b" },
  { id: "frigo", label: "Frigo e freschi", color: "#3f9bc9" },
  { id: "bevande", label: "Bevande", color: "#8a6fd1" },
  { id: "pulizia", label: "Pulizia casa", color: "#2fa37a" },
  { id: "igiene", label: "Bagno e igiene", color: "#d4609a" },
  { id: "altro", label: "Altro", color: "#8b958e" },
];
const catById = Object.fromEntries(CATS.map(c => [c.id, c]));
const GUESS = [
  [/sapon|shampoo|bagnoschiuma|dentifric|spazzolin|carta igien|deodor|assorbent|rasoi|cotton|crema|balsamo/i, "igiene"],
  [/detersiv|candeggin|sgrassat|anticalcare|spugn|pattumier|sacchett|ammorbid|lavastovigl|lavatric|pavimenti|scottex|carta cucina|vetri|brillantante/i, "pulizia"],
  [/latte|yogurt|burro|formagg|mozzarell|uova|prosciutt|insalat|verdur|frutta|carne|pollo|pesce|panna/i, "frigo"],
  [/acqua|vino|birra|succo|caff[eè]|t[eè]\b|bibit|coca/i, "bevande"],
  [/pasta|riso|pane|farina|zucchero|sale|olio|aceto|biscott|cereali|pelati|passata|legumi|tonno|crackers|merend/i, "cibo"],
];
const CODE_RE = /^[A-Z0-9]{4}(-[A-Z0-9]{4}){3}$/;
const CODE_ALPHABET = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

const $ = id => document.getElementById(id);
const store = {
  get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } },
  set(k, v) { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (_) {} },
};

const state = {
  view: "boot",            // boot | setup | app | settings
  list: store.get("onf-tab") === "mio" ? "mio" : "casa",
  filter: "all", status: "out",
  items: { casa: [], mio: [] },
  loaded: { casa: false, mio: false },
  pending: { casa: false, mio: false },
  uid: null, code: store.get("onf-code"), me: store.get("onf-name") || "",
  problem: null,
};
let unsubs = [], pendingDel = null, toastTimer = null, undoFn = null;

// Codice arrivato da un link d'invito (#casa=XXXX-XXXX-XXXX-XXXX)
const fromLink = parseCode(location.hash);
if (fromLink) { state.code = fromLink; store.set("onf-code", fromLink); history.replaceState(null, "", location.pathname); }

function parseCode(text) {
  if (!text) return null;
  const m = String(text).toUpperCase().match(/[A-Z0-9]{4}-?[A-Z0-9]{4}-?[A-Z0-9]{4}-?[A-Z0-9]{4}/);
  if (!m) return null;
  const raw = m[0].replace(/-/g, "");
  const code = raw.match(/.{4}/g).join("-");
  return CODE_RE.test(code) ? code : null;
}
function newCode() {
  const bytes = crypto.getRandomValues(new Uint8Array(16));
  const s = Array.from(bytes, b => CODE_ALPHABET[b % CODE_ALPHABET.length]).join("");
  return s.match(/.{4}/g).join("-");
}
const inviteLink = () => `${location.origin}${location.pathname}#casa=${state.code}`;
const esc = s => String(s ?? "").replace(/[&<>"']/g, ch => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
const norm = s => s.trim().toLocaleLowerCase("it-IT").replace(/\s+/g, " ");
function ago(ts) {
  if (!ts) return "";
  const s = Math.max(0, (Date.now() - ts) / 1000);
  if (s < 60) return "adesso";
  if (s < 3600) return `${Math.floor(s / 60)} min fa`;
  if (s < 86400) return `${Math.floor(s / 3600)} h fa`;
  const d = Math.floor(s / 86400);
  if (d === 1) return "ieri";
  if (d < 7) return `${d} giorni fa`;
  return new Date(ts).toLocaleDateString("it-IT", { day: "numeric", month: "short" });
}

// ---------- dati ----------
function colFor(list) {
  return list === "casa"
    ? collection(fs, "households", state.code, "items")
    : collection(fs, "users", state.uid, "items");
}
function write(list, id, data, isNew) {
  const ref = doc(colFor(list), id);
  // Con la cache locale la scrittura vale subito, anche senza rete; la sincronizzazione avviene dopo.
  const p = isNew ? setDoc(ref, data) : updateDoc(ref, data);
  p.catch(handleWriteError);
  return p;
}
function handleWriteError(e) {
  console.error(e);
  state.problem = e && e.code === "permission-denied"
    ? "Il database ha rifiutato la modifica. Controlla che le regole di Firestore siano state pubblicate (vedi README)."
    : "Non sono riuscito a salvare. Controlla la connessione e riprova.";
  render();
}

function subscribe(list) {
  const timer = setTimeout(() => {
    if (!state.loaded[list]) { state.loaded[list] = true; setSync(); render(); }
  }, 8000);
  const unsub = onSnapshot(colFor(list), { includeMetadataChanges: true }, snap => {
    clearTimeout(timer);
    state.items[list] = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    state.loaded[list] = true;
    state.pending[list] = snap.metadata.hasPendingWrites;
    state.fromCache = snap.metadata.fromCache;
    if (state.problem && state.problem.startsWith("La lista")) state.problem = null;
    setSync(); render();
  }, err => {
    clearTimeout(timer);
    console.error(err);
    state.loaded[list] = true;
    state.problem = err.code === "permission-denied"
      ? "La lista non è accessibile: le regole di Firestore non sono ancora state pubblicate (vedi README)."
      : "La lista si è scollegata. Chiudi e riapri l’app per riprovare.";
    $("sync").dataset.state = "error"; $("sync-text").textContent = "Errore";
    render();
  });
  unsubs.push(unsub);
}
function startLists() {
  unsubs.forEach(u => u()); unsubs = [];
  state.items = { casa: [], mio: [] }; state.loaded = { casa: false, mio: false };
  subscribe("casa"); subscribe("mio");
}
function setSync() {
  const el = $("sync");
  if (!navigator.onLine) { el.dataset.state = "pending"; $("sync-text").textContent = "Offline"; return; }
  if (state.pending.casa || state.pending.mio) { el.dataset.state = "pending"; $("sync-text").textContent = "Salvataggio…"; return; }
  el.dataset.state = "live"; $("sync-text").textContent = "Sincronizzato";
}
addEventListener("online", setSync); addEventListener("offline", setSync);

// ---------- azioni ----------
$("add-cat").innerHTML = CATS.map(c => `<option value="${c.id}">${c.label}</option>`).join("");
let catTouched = false;
$("add-cat").addEventListener("change", () => { catTouched = true; });
$("add-name").addEventListener("input", e => {
  const v = e.target.value.trim();
  $("add-btn").disabled = !v;
  if (!catTouched) { const g = GUESS.find(([re]) => re.test(v)); if (g) $("add-cat").value = g[1]; }
});
document.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => {
  state.status = b.dataset.v;
  document.querySelectorAll(".seg button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
}));
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => {
  state.list = t.dataset.list; state.filter = "all"; store.set("onf-tab", state.list); render();
}));

$("add-form").addEventListener("submit", e => {
  e.preventDefault();
  const name = $("add-name").value.trim().replace(/\s+/g, " ");
  if (!name || !state.uid) return;
  const note = $("add-note").value.trim();
  const cat = $("add-cat").value;
  const list = state.list;
  const existing = state.items[list].find(i => norm(i.name) === norm(name));
  $("add-name").value = ""; $("add-note").value = ""; $("add-btn").disabled = true; catTouched = false;
  const who = { byUid: state.uid, byName: state.me, at: Date.now(), boughtUid: null, boughtName: null, boughtAt: null };
  if (existing) {
    write(list, existing.id, { status: state.status, cat, note: note || existing.note || "", ...who }).catch(() => {});
    showToast(existing.status === "ok" ? `“${existing.name}” è di nuovo in lista` : `“${existing.name}” era già in lista: aggiornato`);
  } else {
    write(list, doc(colFor(list)).id, { name, cat, note, status: state.status, ...who }, true).catch(() => {});
  }
});

function markBought(list, item, rowEl) {
  if (rowEl) rowEl.classList.add("done-anim");
  const prev = { status: item.status, boughtUid: item.boughtUid || null, boughtName: item.boughtName || null, boughtAt: item.boughtAt || null };
  setTimeout(() => {
    write(list, item.id, { status: "ok", boughtUid: state.uid, boughtName: state.me, boughtAt: Date.now() }).catch(() => {});
    showToast(`Preso: ${item.name}`, () => write(list, item.id, prev).catch(() => {}));
  }, 180);
}
function remove(list, item) {
  const copy = { ...item }; delete copy.id;
  deleteDoc(doc(colFor(list), item.id)).catch(handleWriteError);
  showToast(`Eliminato: ${item.name}`, () => write(list, item.id, copy, true).catch(() => {}));
}
function showToast(text, undo) {
  $("toast-text").textContent = text;
  undoFn = undo || null;
  $("toast-undo").hidden = !undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; undoFn = null; }, 5000);
}
$("toast-undo").addEventListener("click", () => { const f = undoFn; $("toast").hidden = true; undoFn = null; if (f) f(); });

$("main").addEventListener("click", e => {
  const b = e.target.closest("button[data-act]");
  if (!b || state.view !== "app") return;
  const list = state.list;
  const item = state.items[list].find(i => i.id === b.dataset.id);
  if (!item) return;
  const act = b.dataset.act;
  if (act === "buy") markBought(list, item, b.closest(".item"));
  else if (act === "urg") write(list, item.id, { status: item.status === "out" ? "low" : "out" }).catch(() => {});
  else if (act === "again") write(list, item.id, { status: "out", byUid: state.uid, byName: state.me, at: Date.now(), boughtUid: null, boughtName: null, boughtAt: null }).catch(() => {});
  else if (act === "del") {
    pendingDel = item.id; render();
    setTimeout(() => { if (pendingDel === item.id) { pendingDel = null; render(); } }, 3500);
  } else if (act === "del-yes") { pendingDel = null; remove(list, item); }
});

$("open-settings").addEventListener("click", () => { state.view = state.view === "settings" ? "app" : "settings"; render(); });

// ---------- schermate ----------
function renderSetup() {
  $("main").innerHTML = `
    <section class="panel">
      <h2>Benvenuto</h2>
      <p>Segnate qui cosa finisce in casa. Una persona crea la lista, l’altra entra con il codice.</p>
      <div class="field"><label for="setup-name">Come ti chiami?</label>
        <input id="setup-name" type="text" maxlength="30" placeholder="es. Giulia" value="${esc(state.me)}" autocomplete="given-name"></div>
      <button class="btn" id="setup-create" type="button">Crea una nuova lista di casa</button>
      <div class="or">oppure</div>
      <div class="field"><label for="setup-code">Hai ricevuto un codice o un link?</label>
        <input id="setup-code" type="text" placeholder="XXXX-XXXX-XXXX-XXXX" value="${esc(state.code || "")}" autocapitalize="characters" autocomplete="off" spellcheck="false"></div>
      <button class="btn ghost" id="setup-join" type="button">Entra nella lista</button>
      <p id="setup-err" class="notice" data-kind="error" hidden></p>
    </section>`;
  const err = t => { $("setup-err").textContent = t; $("setup-err").hidden = false; };
  const saveName = () => {
    const n = $("setup-name").value.trim();
    if (!n) { err("Scrivi il tuo nome: serve all’altra persona per sapere chi ha segnato cosa."); return false; }
    state.me = n; store.set("onf-name", n); return true;
  };
  $("setup-create").addEventListener("click", () => {
    if (!saveName()) return;
    state.code = newCode(); store.set("onf-code", state.code);
    state.view = "settings"; state.justCreated = true; startLists(); render();
  });
  $("setup-join").addEventListener("click", () => {
    if (!saveName()) return;
    const c = parseCode($("setup-code").value);
    if (!c) { err("Il codice non è valido. Deve avere 16 caratteri, come ABCD-EFGH-JKLM-NPQR."); return; }
    state.code = c; store.set("onf-code", c);
    state.view = "app"; startLists(); render();
  });
}

function renderSettings() {
  $("main").innerHTML = `
    <section class="panel">
      <h2>${state.justCreated ? "Lista creata!" : "Condividi e impostazioni"}</h2>
      <p>Per usare la lista in due, manda questo link all’altra persona. Chi ha il codice può leggere e modificare la lista “Casa”, quindi tienilo tra voi.</p>
      <div class="code" id="invite-code">${esc(state.code)}</div>
      <div class="row">
        <button class="btn" id="copy-link" type="button">Copia link d’invito</button>
        <button class="btn ghost" id="share-link" type="button" ${navigator.share ? "" : "hidden"}>Condividi…</button>
      </div>
      <p style="font-size:13px">Sull’iPhone dell’altra persona:</p>
      <ol class="steps">
        <li>Apre il link in Safari e tocca Condividi → <b>Aggiungi alla schermata Home</b>.</li>
        <li>Apre l’app dall’icona e, se lo chiede, incolla il codice qui sopra.</li>
      </ol>
      <div class="field"><label for="set-name">Il tuo nome</label>
        <input id="set-name" type="text" maxlength="30" value="${esc(state.me)}"></div>
      <div class="row">
        <button class="btn" id="settings-done" type="button">Vai alla lista</button>
        <button class="btn danger" id="leave" type="button">Esci da questa lista</button>
      </div>
      <p id="leave-confirm" hidden style="font-size:13px">Uscendo, su questo telefono non vedrai più la lista “Casa” finché non reinserisci il codice. I dati restano salvati per l’altra persona. <button class="confirm-del" id="leave-yes" type="button">Esci</button></p>
    </section>`;
  const msg = text => showToast(text);
  $("copy-link").addEventListener("click", () => {
    const link = inviteLink();
    navigator.clipboard?.writeText(link).then(() => msg("Link copiato"), () => {
      const r = document.createRange(); r.selectNodeContents($("invite-code"));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r); msg("Copia il codice selezionato");
    }) ?? msg("Copia il codice qui sopra");
  });
  $("share-link").addEventListener("click", () => {
    navigator.share({ title: "Oh no, è finito!", text: "Entra nella nostra lista della spesa di casa:", url: inviteLink() }).catch(() => {});
  });
  $("set-name").addEventListener("change", e => {
    const n = e.target.value.trim(); if (n) { state.me = n; store.set("onf-name", n); msg("Nome salvato"); }
  });
  $("settings-done").addEventListener("click", () => { state.justCreated = false; state.view = "app"; render(); });
  $("leave").addEventListener("click", () => { $("leave-confirm").hidden = false; });
  $("leave-yes").addEventListener("click", () => {
    unsubs.forEach(u => u()); unsubs = [];
    state.code = null; store.set("onf-code", null); state.view = "setup"; render();
  });
}

const ICON_CHECK = `<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 8.5l3 3 6-7"/></svg>`;
const ICON_TRASH = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 6h12M8 6V4.5h4V6M6 6l.7 9.5h6.6L14 6"/></svg>`;

function renderFilters() {
  const counts = {};
  state.items[state.list].forEach(i => { if (i.status !== "ok") counts[i.cat] = (counts[i.cat] || 0) + 1; });
  const opts = [{ id: "all", label: "Tutto" }, ...CATS.filter(c => counts[c.id] || state.filter === c.id)];
  $("filters").innerHTML = opts.map(c =>
    `<button type="button" data-f="${c.id}" aria-pressed="${state.filter === c.id}">${c.label}${c.id !== "all" ? ` · ${counts[c.id] || 0}` : ""}</button>`).join("");
  $("filters").hidden = opts.length < 3;
  $("filters").querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    state.filter = state.filter === b.dataset.f ? "all" : b.dataset.f; render();
  }));
}

function renderList() {
  const list = state.list;
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", String(t.dataset.list === list)));
  $("tab-hint").textContent = list === "casa"
    ? "Lista condivisa: la vede e la modifica chi ha il codice di casa."
    : "Lista personale: la vedi solo tu, su questo telefono.";
  for (const l of ["casa", "mio"]) {
    const n = state.items[l].filter(i => i.status !== "ok").length;
    const el = $("count-" + l); el.textContent = n; el.toggleAttribute("data-zero", n === 0);
  }
  renderFilters();

  const items = state.items[list];
  const showWho = list === "casa";
  const who = (uid, name) => uid && uid === state.uid ? "te" : (name || "qualcuno");
  const parts = [];
  if (state.problem) parts.push(`<div class="notice" data-kind="error">${esc(state.problem)}</div>`);
  if (!state.loaded[list]) {
    parts.push(`<div class="empty"><strong>Sto caricando la lista</strong>Tra un attimo vedi cosa manca in casa.</div>`);
    $("main").innerHTML = parts.join(""); return;
  }
  const match = i => state.filter === "all" || i.cat === state.filter;
  const need = items.filter(i => i.status !== "ok" && match(i))
    .sort((a, b) => (a.status === b.status ? 0 : a.status === "out" ? -1 : 1) || (b.at || 0) - (a.at || 0));
  const home = items.filter(i => i.status === "ok" && match(i)).sort((a, b) => (b.boughtAt || 0) - (a.boughtAt || 0));
  const outN = need.filter(i => i.status === "out").length, lowN = need.length - outN;

  let sec = `<section aria-labelledby="h-need"><h2 class="section-title" id="h-need">Da comprare <span>${need.length ? `${outN} finiti · ${lowN} in esaurimento` : ""}</span></h2>`;
  if (!need.length) {
    sec += items.length
      ? `<div class="empty"><strong>Non manca niente</strong>${state.filter === "all" ? "Quando qualcosa finisce, scrivilo qui sopra o toccalo tra le cose in casa." : "Niente da comprare in questa categoria."}</div>`
      : `<div class="empty"><strong>La lista è vuota</strong>Scrivi qui sopra la prima cosa finita, per esempio “carta igienica” o “latte”.${list === "casa" ? " Chi ha il codice di casa la vedrà subito." : ""}</div>`;
  } else {
    for (const c of CATS) {
      const g = need.filter(i => (catById[i.cat] ? i.cat : "altro") === c.id);
      if (!g.length) continue;
      sec += `<div class="group"><h3><span class="dot" style="background:${c.color}"></span>${c.label}</h3>`;
      for (const i of g) {
        const meta = [];
        if (i.note) meta.push(esc(i.note));
        if (showWho) meta.push(`segnato da <span class="n">${esc(who(i.byUid, i.byName))}</span> ${ago(i.at)}`);
        else if (i.at) meta.push(ago(i.at));
        const del = pendingDel === i.id
          ? `<button class="confirm-del" data-act="del-yes" data-id="${esc(i.id)}">Elimina</button>`
          : `<button class="icon-btn" data-act="del" data-id="${esc(i.id)}" aria-label="Elimina ${esc(i.name)}">${ICON_TRASH}</button>`;
        sec += `<div class="item">
          <button class="check" data-act="buy" data-id="${esc(i.id)}" aria-label="Segna ${esc(i.name)} come comprato">${ICON_CHECK}</button>
          <div class="body"><div class="name">${esc(i.name)}</div>${meta.length ? `<div class="meta">${meta.join(" · ")}</div>` : ""}</div>
          <div class="right"><button class="pill" data-s="${i.status === "low" ? "low" : "out"}" data-act="urg" data-id="${esc(i.id)}">${i.status === "low" ? "Sta finendo" : "Finito"}</button>${del}</div>
        </div>`;
      }
      sec += `</div>`;
    }
  }
  sec += `</section>`;
  parts.push(sec);

  if (home.length) {
    let h = `<section aria-labelledby="h-home"><h2 class="section-title" id="h-home">In casa <span>${home.length}</span></h2>
      <p class="home-hint">Le cose già comprate restano qui. Quando finiscono di nuovo, tocca “Finito”.</p><div class="home">`;
    for (const i of home) {
      const t = showWho && i.boughtAt ? `Preso da ${who(i.boughtUid, i.boughtName)} ${ago(i.boughtAt)}` : (i.boughtAt ? `Preso ${ago(i.boughtAt)}` : "");
      h += `<span class="chip" title="${esc(t)}"><span class="dot" style="background:${(catById[i.cat] || catById.altro).color}"></span><span class="label">${esc(i.name)}</span>`;
      h += pendingDel === i.id
        ? `<button class="confirm-del" data-act="del-yes" data-id="${esc(i.id)}">Elimina</button>`
        : `<button data-act="again" data-id="${esc(i.id)}">Finito</button><button class="x" data-act="del" data-id="${esc(i.id)}" aria-label="Elimina ${esc(i.name)}">✕</button>`;
      h += `</span>`;
    }
    h += `</div></section>`;
    parts.push(h);
  }
  $("main").innerHTML = parts.join("");
}

function render() {
  $("app-top").hidden = state.view !== "app";
  $("open-settings").hidden = !(state.view === "app" || state.view === "settings");
  if (state.view === "setup") renderSetup();
  else if (state.view === "settings") renderSettings();
  else if (state.view === "app") renderList();
}
setInterval(() => { if (document.visibilityState === "visible" && state.view === "app") render(); }, 60000);

// ---------- avvio ----------
const bootTimer = setTimeout(() => {
  if (!state.uid) {
    $("main").innerHTML = `<div class="notice" data-kind="error">Non riesco a collegarmi. Controlla la connessione. Se il problema resta, in Firebase verifica che l’accesso “Anonimo” sia attivo (vedi README).</div>`;
    $("sync").dataset.state = "error"; $("sync-text").textContent = "Non collegato";
  }
}, 10000);

onAuthStateChanged(auth, user => {
  if (!user) {
    signInAnonymously(auth).catch(e => {
      console.error(e);
      clearTimeout(bootTimer);
      $("main").innerHTML = `<div class="notice" data-kind="error">Accesso non riuscito (${esc(e.code || "errore")}). In Firebase attiva Authentication → Metodo di accesso → Anonimo, e aggiungi questo dominio tra i domini autorizzati.</div>`;
      $("sync").dataset.state = "error"; $("sync-text").textContent = "Non collegato";
    });
    return;
  }
  clearTimeout(bootTimer);
  const first = !state.uid;
  state.uid = user.uid;
  if (!first) return;
  setSync();
  if (state.code && state.me) { state.view = "app"; startLists(); }
  else state.view = "setup";
  render();
});

if ("serviceWorker" in navigator) {
  addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
</script>
</body>
</html>
