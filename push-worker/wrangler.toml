# Servizio delle notifiche push (Cloudflare Workers).
# Pubblicazione manuale, se serve:  npx wrangler deploy
# La chiave privata VAPID è un segreto del worker:  npx wrangler secret put VAPID_PRIVATE_JWK
name = "ohnoefinito-push"
main = "worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[vars]
ALLOWED_ORIGINS = "https://omgiian.github.io,http://localhost:8765"
VAPID_SUBJECT = "https://omgiian.github.io/ohnoefinito/"
